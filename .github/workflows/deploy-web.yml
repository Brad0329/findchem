# 웹 배포 — master에 push하면 GitHub Actions가 웹을 빌드해 GitHub Pages에 올린다.
# 주소: https://brad0329.github.io/findchem/  (2026-09-12 사용자 결정, plan.md Phase 006)
#
# base-href가 `/findchem/`인 이유: 프로젝트 Pages는 저장소 이름 하위 경로로 서비스된다.
# 이 값이 비면 main.dart.js·asset 경로가 전부 404가 된다.
#
# CI는 매번 새 체크아웃에서 빌드하므로 낡은 web_plugin_registrant.dart 재사용
# (CLAUDE.md '알려진 함정')은 여기서 일어나지 않는다. 로컬 수동 빌드에서만 주의한다.
name: Deploy web to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 연달아 push하면 앞 실행을 취소하고 마지막 것만 올린다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.6 # 로컬 PC와 같은 버전 (scripts/cloud_setup.sh와 함께 올린다)
          channel: stable
          cache: true

      - run: flutter pub get

      # 검증이 통과해야 배포된다 — 실패하면 이 job이 멈추고 Pages는 이전 버전 그대로 남는다.
      - run: flutter analyze
      - run: flutter test --reporter failures-only

      # F-007 기본 키: Secret DATA_GO_KR_KEY를 빌드 상수로 넣는다(lib/lookup/api_settings.dart가 같은 이름을 읽는다 —
      # 이름 대조는 test/lookup/api_settings_test.dart). 배포된 JS에서 공개됨을 감수한 결정이다(REQUIREMENTS 비기능 4).
      # Secret이 없으면 빈 값 → 기본 키 없음(사용자가 설정에서 키를 넣는 종전 동작).
      - run: flutter build web --base-href /findchem/ --dart-define=DATA_GO_KR_DEFAULT_KEY="$DATA_GO_KR_KEY"
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
